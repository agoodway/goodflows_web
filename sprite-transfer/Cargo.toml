[package]
name = "gf-transfer"
version = "0.1.0"
edition = "2021"
description = "Resumable framed transfer helper that runs inside GoodFlows Sprites"
license = "UNLICENSED"
publish = false

[lib]
name = "gf_transfer"
path = "src/lib.rs"

[[bin]]
name = "gf-transfer"
path = "src/main.rs"

[dependencies]
flate2 = "1"
hex = "0.4"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = { version = "0.4", default-features = false }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

# Hashing and inflating large test payloads is far too slow unoptimized.
[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.miniz_oxide]
opt-level = 3

[profile.dev.package.flate2]
opt-level = 3
