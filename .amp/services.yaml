services:
  postgres:
    platforms: [linux]
    # The cluster's major version follows the Debian release (15 on 12, 17 on 13).
    command: sudo pg_ctlcluster --foreground "$(ls /etc/postgresql)" main start
    port: 5432
  web:
    platforms: [linux]
    cwd: app
    command: >-
      ../.agents/resume &&
      PHX_HOST="$(printf '%s' "$PUBLIC_URL" | cut -d/ -f3)" exec mix phx.server
    health: /users/log-in
    portal:
      title: GoodFlows
      description: 'Development login: user@example.com / password1234password1234'
