services:
  postgres:
    platforms: [linux]
    # .agents/setup picks the major (15 on Debian 12, 17 on 13) and exports it in the login profile.
    command: sudo pg_ctlcluster --foreground "${GOODFLOWS_PG_MAJOR:?run .agents/setup}" main start
    port: 5432
  web:
    platforms: [linux]
    cwd: app
    command: >-
      ../.agents/resume &&
      PHX_HOST="$(printf '%s' "$PUBLIC_URL" | cut -d/ -f3)" exec mix phx.server
    health: /users/log-in
    portal:
      title: GoodFlows
      description: 'Development login: user@example.com / password1234password1234'
