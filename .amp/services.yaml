services:
  postgres:
    platforms: [linux]
    # .agents/setup installs 15 on Debian 12 and 17 on 13. Restoring an orb snapshot rewrites the
    # login profile, so the service reads the version from the installed `main` cluster.
    command: >-
      major="$(pg_lsclusters --no-header | awk '$2 == "main" {print $1; exit}')" &&
      exec sudo pg_ctlcluster --foreground "${major:?no main PostgreSQL cluster, run .agents/setup}" main start
    port: 5432
  web:
    platforms: [linux]
    cwd: app
    command: >-
      ../.agents/resume &&
      PHX_HOST="$(printf '%s' "$PUBLIC_URL" | cut -d/ -f3)" exec mix phx.server
    health: /users/log-in
    portal:
      title: GoodFlows
      description: 'Development login: user@example.com / password1234password1234'
